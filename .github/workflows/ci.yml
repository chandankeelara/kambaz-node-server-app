name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_CONNECTION_STRING: mongodb://127.0.0.1:27017/kambaz_test
      TEST_DB_CONNECTION_STRING: mongodb://127.0.0.1:27017/kambaz_test
      TEST_BASE_URL: http://localhost:4000
      SERVER_ENV: development
      SESSION_SECRET: ci-only-secret
      PORT: 4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Start API server
        run: |
          nohup node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/test > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server did not start"; cat server.log; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run test suite
        run: python -m pytest tests -p no:cacheprovider -ra --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            server.log
